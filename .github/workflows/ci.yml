# Github actions workflow name
name: CI

# Triggers the workflow on push or pull request events
on:
  push:
    branches: [stylum]
    tags: ['**']
  pull_request:

jobs:
  node_tests:
    name: 'Test stylum on ${{matrix.os}} with node${{matrix.node}}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Supported LTS lines (active + maintenance)
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
     - uses: actions/checkout@v7
     - uses: actions/setup-node@v7
       with:
         node-version: ${{ matrix.node }}
     - name: Install npm dependencies
       run: npm install
     - name: Print node & npm version
       run: node --version && npm --version
     - name: Run Test
       run: npm run test

  benchmark:
    name: 'Run stylum benchmark with node26'
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v7
     - uses: actions/setup-node@v7
       with:
         node-version: 26
     - name: Install npm dependencies
       run: npm install
     - name: Print node & npm version
       run: node --version && npm --version
     - name: Run Benchmark
       run: node ./bm.js

  yarn-regression:
    name: 'yarn exec stylum regression test'
    runs-on: macos-latest
    steps:
     - uses: actions/checkout@v7
     - uses: actions/setup-node@v7
       with:
         node-version: 26
     - name: Print node & npm version
       run: node --version && npm --version
     - name: Install yarn global
       run: npm install -g yarn
     - name: Run Yarn
       working-directory: ./test/yarn
       run: yarn install && yarn add file:../.. && yarn run stylum --version

  coverage:
    name: 'Run nyc for code coverage'
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v7
     - uses: actions/setup-node@v7
       with:
         node-version: 26
     - name: Print node & npm version
       run: node --version && npm --version
     - name: Install npm dependencies
       run: npm install
     - name: Run nyc
       run: npx nyc@latest npm run test

  deno_tests:
    name: 'Test stylum on ${{matrix.os}} with deno 2'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
     - uses: actions/checkout@v7
     - uses: denoland/setup-deno@v2
       with:
         deno-version: v2.x
     - name: Print deno version
       run: deno --version
     - name: Install dependencies
       run: deno install
     - name: Run Test
       run: deno run -A deno/test.ts
